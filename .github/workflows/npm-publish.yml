name: Publish VS Code Extension

on:
  push:
    # branches:
    #   - master
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:  
      contents: write  # 允许写入 commit 评论
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build project
        run: |
          echo "Starting build process..."
          echo "Running webpack build..."
          echo "Running vsce package..."
          pnpm run build
          echo "Build completed. Checking output directory..."
          ls -la
        
      - name: Verify build output
        run: |
          if [ -z "$(find . -name 'kits-ffgz-*.vsix' -print -quit)" ]; then
            echo "Error: No .vsix file found matching 'kits-ffgz-*.vsix'"
            exit 1
          fi
          echo "Found .vsix file: $(find . -name 'kits-ffgz-*.vsix')"
          
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v1
        id: publishToOpenVSX
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          vsixPath: kits-ffgz-*.vsix
          
      - name: Notify on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = context.ref.replace('refs/tags/', '');
            const message = `✅ Extension published successfully!\nVersion: ${version}\nMarketplace: https://marketplace.visualstudio.com/items?itemName=${owner}.${repo}`;
            github.rest.repos.createCommitComment({
              owner,
              repo,
              commit_sha: context.sha,
              body: message
            });